name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt ruff==0.11.13
      - run: python -m ruff check --exclude dependencies,build,reference .
      - run: python -m unittest test_converter tests.test_follower tests.test_combat_style tests.test_skypatcher tests.test_original_headwear tests.test_seating tests.test_wardrobe tests.test_package tests.test_armor tests.test_equipment_runtime tests.test_materials tests.test_official_equipment tests.test_patch_deployment tests.test_textures tests.test_localization tests.test_runtime_dependencies tests.test_head_preview tests.test_wizard_server tests.test_toon tests.test_equipment_textures tests.test_original_weapon
